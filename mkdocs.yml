site_name: Next Gen Calling AI Elevate with Webex
site_description: Cisco Live Melbourne 2026 LABCOL-2376 lab guide
theme:
  name: material
  logo: assets/cisco-live-logo.png
  favicon: assets/cisco-live-logo.png
  font: false
  palette:
    primary: custom
    accent: cyan
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
markdown_extensions:
  - admonition
  - sane_lists
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/cisco-live-2026.css
extra:
  generator: false
nav:
  - Home: index.md
  - Getting Started:
      - Lab Overview: index.md
      - Access your Lab Environment: 01-access-the-lab.md
  - Webex Calling AI:
      - Set up the Webex Calling organization: 02-webex-calling-org.md
      - Configure the Local Gateway: 03-local-gateway.md
      - Test captions and transcripts: 04-captions-transcripts.md
      - Test recording summaries: 05-recording-summaries.md
